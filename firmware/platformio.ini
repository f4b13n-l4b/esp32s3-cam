; Caméra de ligne d'arrivée — ESP32-S3 + capteur OV2640/OV3660/OV5640
; Cible par défaut : module ESP32-S3-WROOM-1 N16R8 (16 Mo flash, 8 Mo PSRAM octale)

[platformio]
default_envs = s3eye

[env]
; Fork « pioarduino » : fournit le cœur Arduino-ESP32 3.x (inclut esp32-camera)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; PSRAM octale (OPI) obligatoire sur les modules N16R8 / N8R8.
; Si la carte boucle au démarrage (« PSRAM ID read error »), passer à qio_qspi.
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; Brochage ESP32-S3-EYE : la plupart des cartes « ESP32-S3-CAM » génériques,
; Freenove ESP32-S3-WROOM CAM, Keyestudio MB0184/MB0200…
[env:s3eye]
; Logs série via le port USB-C « UART » (puce CH340). Si la carte n'a qu'un port
; USB natif, mettre ARDUINO_USB_CDC_ON_BOOT=1.
build_flags = ${env.build_flags} -DCAMERA_PINOUT_S3EYE -DARDUINO_USB_CDC_ON_BOOT=0

; Seeed Studio XIAO ESP32S3 Sense (PSRAM 8 Mo OPI, flash 8 Mo)
[env:xiao]
board = seeed_xiao_esp32s3
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -DCAMERA_PINOUT_XIAO
